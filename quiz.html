<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz do Amor ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #000000, #2b0000);
    color: white;
    text-align: center;
    padding: 50px;
    min-height: 100vh;
}

#quiz{
    background: rgba(0,0,0,0.7);
    padding: 30px;
    border-radius: 20px;
    max-width: 700px;
    margin: auto;
    position: relative;
    z-index: 2;
}

#fotoPergunta{
    width: 100%;
    max-width: 320px;
    height: auto;
    border-radius: 15px;
    margin-bottom: 20px;
    border: 3px solid rgba(255,255,255,0.2);
}
.coracao{
    position: fixed;
    top: -50px;
    z-index: 1;
    pointer-events: none;
    animation: cair 6s linear forwards;
}

@keyframes cair{
    from{
        transform: translateY(-50px);
        opacity: 1;
    }

    to{
        transform: translateY(110vh);
        opacity: 0;
    }
}

button{
    padding: 12px 24px;
    margin: 10px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

button:hover{
    transform: scale(1.05);
}
</style>
</head>

<body>

<h1>❤️ Quiz do Amor ❤️</h1>

<div id="quiz">

    <img id="fotoPergunta" src="" alt="Foto do casal">

    <h2 id="pergunta"></h2>

    <div id="respostas"></div>

</div>

<script>

const perguntas = [
{
    pergunta: "Qual a data do nosso namoro?",
    opcoes: ["21/10/2023", "23/09/2023", "21/09/2023"],
    correta: 0,
    foto: "63e7b153-a454-4302-94a1-1df2c99fa803.jpg"
},
{
    pergunta: "Quem disse 'eu te amo' primeiro?",
    opcoes: ["Momo Cristine da Silva", "Momo da Silva", "Os dois"],
    correta: 0,
    foto: "38e1975e-4346-4258-b383-402a4aa54958.jpg"
},
{
    pergunta: "Qual apelido é o que eu mais te chamo?",
    opcoes: ["Amor", "Dengo", "Momo"],
    correta: [0,1,2],
    foto: "96724fb7-e11e-4c71-9f98-c8f6363b6223.jpg"
},
{
    pergunta: "Quem é mais teimoso?",
    opcoes: ["Momo da Silva", "Momo Cristine da Silva", "Os dois"],
    correta: 2,
    foto: "085d71dd-807f-43af-ad82-e01bf72de986.jpg"
},
{
    pergunta: "Quanto eu te amo? ❤️",
    opcoes: ["Muito", "Demais", "Infinitamente"],
    correta: [0,1,2],
    foto: "1a857ee4-ae4a-4d53-82ae-97298f01d401.jpg"
}
];

let atual = 0;
let pontos = 0;

function carregarPergunta() {

    const p = perguntas[atual];

    document.getElementById("fotoPergunta").src = p.foto;

    document.getElementById("pergunta").innerText = p.pergunta;

    let html = "";

    p.opcoes.forEach((opcao, index) => {
        html += `<button onclick="responder(${index})">${opcao}</button><br>`;
    });

    document.getElementById("respostas").innerHTML = html;
}

function responder(indice) {

    const correta = perguntas[atual].correta;

    if (
        (Array.isArray(correta) && correta.includes(indice))
        ||
        (indice === correta)
    ) {
        pontos++;
    }

    atual++;

    if (atual < perguntas.length) {

        carregarPergunta();

    } else {

        document.getElementById("quiz").innerHTML =
        `
        <h1>🏆 Resultado Final ❤️</h1>

        <h2>${pontos} / ${perguntas.length}</h2>

        <p>Você conhece nosso amor muito bem! 💖</p>

        <button onclick="iniciarForca()">
            🔓 Desbloquear Fase Secreta
        </button>
        `;
    }
}

function iniciarForca(){

    const palavra = "MOMOLADA";
    let letrasDescobertas = [];

    document.getElementById("quiz").innerHTML = `
        <h1>🎮 Fase Secreta ❤️</h1>

        <p>Descubra a palavra especial</p>

        <h2 id="palavra"></h2>

        <div id="letras"></div>
    `;

    function atualizarPalavra(){

        let exibicao = "";

        for(let letra of palavra){

            if(letrasDescobertas.includes(letra)){
                exibicao += letra + " ";
            }else{
                exibicao += "_ ";
            }
        }

        document.getElementById("palavra").innerHTML = exibicao;

        if(!exibicao.includes("_")){
            mostrarMensagemFinal();
        }
    }

    let html = "";

    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letra=>{

        html += `
        <button onclick="clicarLetra('${letra}', this)">
            ${letra}
        </button>
        `;
    });

    document.getElementById("letras").innerHTML = html;

    window.clicarLetra = function(letra, botao){

        botao.disabled = true;

        if(palavra.includes(letra)){
            letrasDescobertas.push(letra);
        }

        atualizarPalavra();
    }

    atualizarPalavra();
}

function mostrarMensagemFinal(){

    document.getElementById("quiz").innerHTML = `

        <h1>💌 Uma Carta Para Você 💌</h1>

        <p>Clique na carta para abrir ❤️</p>

        <div onclick="abrirCarta()"
             style="
             font-size:120px;
             cursor:pointer;
             transition:0.3s;
             ">
             ✉️
        </div>

    `;
}

function abrirCarta(){

    document.getElementById("quiz").innerHTML = `

        <img src="download.jpg"
             style="
             width:100%;
             max-width:350px;
             border-radius:15px;
             margin-bottom:20px;
             ">

        <h1>❤️ Parabéns Meu Amorzinho ❤️</h1>

        <p>
        Você encontrou a palavra secreta.
        </p>

        <p>
        Espero que tenha gostado do MomoSite ❤️
        </p>

        <p>
        Feliz Dia dos Namorados, minha vida.
        Este é apenas mais um dos muitos que ainda vamos passar juntos.
        </p>

        <p>
        Obrigado por cada sorriso,
        cada abraço e cada momento ao seu lado.
        </p>

        <p>
        Ich Liebe Dich ❤️
        </p>

    `;

}
function criarCoracao(){

    const coracao = document.createElement("div");

    const emojis = ["❤️","💕","💖","💘","💞"];

    coracao.classList.add("coracao");

    coracao.innerHTML =
        emojis[Math.floor(Math.random() * emojis.length)];

    coracao.style.left =
        Math.random() * window.innerWidth + "px";

    coracao.style.fontSize =
        (15 + Math.random() * 25) + "px";

    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 6000);
}

setInterval(criarCoracao, 700);
carregarPergunta();

</script>

</body>
</html>
