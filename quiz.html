<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz do Amor ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #000000, #2b0000);
    color: white;
    text-align: center;
    padding: 50px;
    min-height: 100vh;
}

#quiz{
    background: rgba(0,0,0,0.7);
    padding: 30px;
    border-radius: 20px;
    max-width: 700px;
    margin: auto;
}

#fotoPergunta{
    width: 100%;
    max-width: 600px;
    height: 320px;
    object-fit: cover;
    border-radius: 15px;
    margin-bottom: 20px;
    border: 3px solid rgba(255,255,255,0.2);
}

button{
    padding: 12px 24px;
    margin: 10px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

button:hover{
    transform: scale(1.05);
}
</style>
</head>

<body>

<h1>❤️ Quiz do Amor ❤️</h1>

<div id="quiz">

    <img id="fotoPergunta" src="" alt="Foto do casal">

    <h2 id="pergunta"></h2>

    <div id="respostas"></div>

</div>

<script>

const perguntas = [
{
    pergunta: "Qual a data do nosso namoro?",
    opcoes: ["21/10/2023", "23/09/2023", "21/09/2023"],
    correta: 0,
    foto: "coracoes.jpg"
},
{
    pergunta: "Quem disse 'eu te amo' primeiro?",
    opcoes: ["Momo Cristine da Silva", "Momo da Silva", "Os dois"],
    correta: 0,
    foto: "foto1.jpg"
},
{
    pergunta: "Qual apelido é o que eu mais te chamo?",
    opcoes: ["Amor", "Dengo", "Momo"],
    correta: [0,1,2],
    foto: "foto2.jpg"
},
{
    pergunta: "Quem é mais teimoso?",
    opcoes: ["Momo da Silva", "Momo Cristine da Silva", "Os dois"],
    correta: 2,
    foto: "foto3.jpg"
},
{
    pergunta: "Quanto eu te amo? ❤️",
    opcoes: ["Muito", "Demais", "Infinitamente"],
    correta: [0,1,2],
    foto: "96724fb7-e11e-4c71-9f98-c8f6363b6223.jpg"
}
];

let atual = 0;
let pontos = 0;

function carregarPergunta() {

    const p = perguntas[atual];

    document.getElementById("fotoPergunta").src = p.foto;

    document.getElementById("pergunta").innerText = p.pergunta;

    let html = "";

    p.opcoes.forEach((opcao, index) => {
        html += `<button onclick="responder(${index})">${opcao}</button><br>`;
    });

    document.getElementById("respostas").innerHTML = html;
}

function responder(indice) {

    const correta = perguntas[atual].correta;

    if (
        (Array.isArray(correta) && correta.includes(indice))
        ||
        (indice === correta)
    ) {
        pontos++;
    }

    atual++;

    if (atual < perguntas.length) {

        carregarPergunta();

    } else {

        document.getElementById("quiz").innerHTML =
        `
        <img src="resultado.jpg"
             style="width:100%;max-width:600px;border-radius:15px;margin-bottom:20px;">

        <h1>🏆 Resultado Final ❤️</h1>

        <h2>${pontos} / ${perguntas.length}</h2>

        <p>Você conhece nosso amor muito bem! 💖</p>

        <p>Eu te amo infinitamente ❤️</p>
        `;
    }
}

carregarPergunta();

</script>

</body>
</html>
